<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="laGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark / Emblem -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Rounded Shield / Base -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#laGrad)"/>
    
    <!-- Open Book Pages Motif -->
    <path d="M 24 68 C 36 62, 46 63, 50 71 C 54 63, 64 62, 76 68 C 76 74, 54 75, 50 78 C 46 75, 24 74, 24 68 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 50 71 L 50 82" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Ascending Revival Flame / Holy Spirit Dove Motif -->
    <path d="M 50 22 C 55 32, 66 38, 66 48 C 66 57, 59 64, 50 64 C 41 64, 34 57, 34 48 C 34 38, 45 32, 50 22 Z" fill="url(#flameGrad)"/>
    <!-- Inner Flame Core -->
    <path d="M 50 34 C 53 40, 58 44, 58 50 C 58 55, 54 59, 50 59 C 46 59, 42 55, 42 50 C 42 44, 47 40, 50 34 Z" fill="#FEF08A"/>
    
    <!-- Small Radiant Compassion Spark -->
    <circle cx="50" cy="18" r="2.5" fill="#FEF08A"/>
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(132, 32)">
    <!-- Primary Name -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="currentColor">
      LATUNDE AKIN
    </text>
    <!-- Subtitle / Mandate -->
    <text x="1" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.16em" text-transform="uppercase" fill="#EA580C" opacity="0.95">
      HAVE COMPASSION ON THEM MISSIONS
    </text>
    <text x="1" y="68" font-family="'Lora', Georgia, serif" font-size="11.5" font-style="italic" fill="#78716C" letter-spacing="0.02em">
      Discipleship, Intercession &amp; Words of Truth
    </text>
  </g>
</svg>
